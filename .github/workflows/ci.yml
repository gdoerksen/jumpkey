name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: build / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test

      # In-app timing (`telemetry` feature, off by default). Its code is
      # compiled out of the steps above, so check it separately.
      - name: telemetry feature clippy + test
        run: |
          cargo clippy --all-targets --features telemetry
          cargo test --features telemetry

      # Benchmark harness (tools/pick-bench). Built and unit-tested here;
      # it can't drive a real desktop on CI runners.
      - name: pick-bench clippy + test
        run: |
          cargo clippy -p pick-bench --all-targets
          cargo test -p pick-bench
