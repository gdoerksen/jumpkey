window_exe = "vivaldi.exe"
settle_ms = 3500

[[scenario]]
name = "tabs"
description = "Tab strip where every tab has a close button (review #25)"
exe = ["{LOCALAPPDATA}\\Vivaldi\\Application\\vivaldi.exe", "{ProgramFiles}\\Vivaldi\\Application\\vivaldi.exe"]
args = ["--user-data-dir={profile}", "--no-first-run", "--no-default-browser-check", "--new-window", "{fixtures_url}/tabs.html"]
window_exe = "vivaldi.exe"
settle_ms = 3000

# --- check mode only (`pick-bench --check`; skipped by --all and the preset) --

[[scenario]]
name = "check-page"
description = "Fixture for the live correctness checks: buttons that report clicks in the page title"
exe = ["{LOCALAPPDATA}\\Vivaldi\\Application\\vivaldi.exe", "{ProgramFiles}\\Vivaldi\\Application\\vivaldi.exe"]
args = ["--user-data-dir={profile}", "--no-first-run", "--no-default-browser-check", "--new-window", "{fixtures_url}/check.html"]
window_exe = "vivaldi.exe"
settle_ms = 3000
check_only = true

# --- Edge: same page, for machines/VMs without Vivaldi ----------------------

[[scenario]]
name = "edge-dense-list"
description = "dense-list.html in Microsoft Edge (installed on every Windows machine)"
exe = ["{ProgramFiles(x86)}\\Microsoft\\Edge\\Application\\msedge.exe", "{ProgramFiles}\\Microsoft\\Edge\\Application\\msedge.exe"]
args = ["--user-data-dir={profile}", "--no-first-run", "--no-default-browser-check", "--new-window", "{fixtures_url}/dense-list.html"]
window_exe = "msedge.exe"
settle_ms = 3500

# --- Desktop apps -----------------------------------------------------------

[[scenario]]
name = "explorer-folder"
description = "File Explorer on bench/fixtures/folder (200 files, generated by pick-bench)"
exe = ["explorer.exe"]
args = ["{fixtures}\\folder"]
window_exe = "explorer.exe"
settle_ms = 2500

[[scenario]]
name = "vscode-repo"
description = "VS Code (Electron) on this repo with two files open"
exe = ["{LOCALAPPDATA}\\Programs\\Microsoft VS Code\\Code.exe", "{ProgramFiles}\\Microsoft VS Code\\Code.exe"]
args = ["--new-window", "{repo}", "{repo}\\src\\hint.rs", "{repo}\\src\\layout_order.rs"]
window_exe = "Code.exe"
settle_ms = 7000

[[scenario]]
name = "terminal-split"
description = "Windows Terminal (WinUI/XAML) with two split panes"
exe = ["wt.exe"]
args = ["-w", "new", "-d", "{repo}", ";", "split-pane", "-V", "-d", "{repo}"]
window_exe = "WindowsTerminal.exe"
settle_ms = 3000
