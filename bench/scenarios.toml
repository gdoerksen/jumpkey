# pick-bench scenarios: which window to benchmark, opened in a fixed state.
#
# Placeholders: {fixtures} (bench/fixtures as a path), {fixtures_url}
# (the same as a file:/// URL), {repo} (repository root), and {NAME} for
# any environment variable, e.g. {LOCALAPPDATA}. The first `exe` that
# exists is used; scenarios whose app isn't installed are skipped.
#
# `window_exe` is the process that owns the window, which can differ
# from `exe` (a folder window belongs to the running explorer.exe).
#
# Web scenarios use local fixture pages so the DOM is identical on every
# run and every machine. Live sites change week to week.
#
# `{profile}` is a fresh, throwaway folder per run and scenario (deleted
# afterwards). Browsers started with it run as their own process tree
# with no tabs, extensions or history from your real profile, so runs are
# repeatable and the target-CPU numbers only count the benchmark window.
# Use --manual in your real browser to see real-profile numbers.

[defaults]
rect = [80, 80, 1600, 1000]   # x, y, width, height in physical pixels, relative to the
                              # chosen monitor's top-left corner (--monitor, default primary)
settle_ms = 2500

# --- Vivaldi (Chromium; the browser UI itself is web content) ---------------

[[scenario]]
name = "dense-list"
description = "~500 rows with checkboxes and star buttons (mail/file-list case, review #25)"
exe = ["{LOCALAPPDATA}\\Vivaldi\\Application\\vivaldi.exe", "{ProgramFiles}\\Vivaldi\\Application\\vivaldi.exe"]
args = ["--user-data-dir={profile}", "--no-first-run", "--no-default-browser-check", "--new-window", "{fixtures_url}/dense-list.html"]
window_exe = "vivaldi.exe"
settle_ms = 3500

[[scenario]]
name = "long-feed"
description = "Long page where most content is off-screen (walk cost vs visible, review #41)"
exe = ["{LOCALAPPDATA}\\Vivaldi\\Application\\vivaldi.exe", "{ProgramFiles}\\Vivaldi\\Application\\vivaldi.exe"]
args = ["--user-data-dir={profile}", "--no-first-run", "--no-default-browser-check", "--new-window", "{fixtures_url}/long-feed.html"]
window_exe = "vivaldi.exe"
settle_ms = 3500

[[scenario]]
name = "form"
description = "Inputs, selects, checkboxes, radios and buttons"
exe = ["{LOCALAPPDATA}\\Vivaldi\\Application\\vivaldi.exe", "{ProgramFiles}\\Vivaldi\\Application\\vivaldi.exe"]
args = ["--user-data-dir={profile}", "--no-first-run", "--no-default-browser-check", "--new-window", "{fixtures_url}/form.html"]
window_exe = "vivaldi.exe"
settle_ms = 3000

[[scenario]]
name = "nested-menu"
description = "ARIA menubar with nested menus (open state)"
exe = ["{LOCALAPPDATA}\\Vivaldi\\Application\\vivaldi.exe", "{ProgramFiles}\\Vivaldi\\Application\\vivaldi.exe"]
args = ["--user-data-dir={profile}", "--no-first-run", "--no-default-browser-check", "--new-window", "{fixtures_url}/nested-menu.html"]
