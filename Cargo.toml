[package]
name = "jumpkey"
description = "Navigate and click anywhere on Windows without touching the mouse."
version = "0.6.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["Graham Doerksen <46031209+gdoerksen@users.noreply.github.com>", "Richard Zampieri <br.developer@gmail.com>"]
repository = "https://github.com/gdoerksen/jumpkey"
homepage = "https://github.com/gdoerksen/jumpkey"
readme = "README.md"
# Not published to crates.io: jumpkey ships as an MSI / GitHub release.
# The library target is internal structure (benches, examples, tests),
# not a public API (architecture review #18, round 7).
publish = false
keywords = ["keyboard", "accessibility", "productivity", "automation", "hotkey"]
categories = ["accessibility", "gui", "os"]

# The root package is the default member, so plain `cargo build` / `cargo test`
# at the repo root still only touch jumpkey itself. The benchmark harness is a
# separate binary that drives jumpkey.exe from outside (see bench/README.md).
[workspace]
members = [".", "tools/pick-bench"]

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.7"
# Lightweight, fair Mutex used to share `CacheManager` between the main
# hotkey-driven backend and the pre-warm worker thread (see
# `src/windows/prewarm.rs`). Cross-platform: lives outside the
# `cfg(windows)` block so the cache module can refer to it directly.
parking_lot = "0.12"
smallvec = "1.15.1"
# Only for the `telemetry` feature (JSON lines in %LOCALAPPDATA%\jumpkey\telemetry).
serde_json = { version = "1", optional = true }

# Windows-only deps. Non-Windows targets compile the lib without these (and
# without the `crate::windows` module), which keeps `cargo check` honest on
# Linux even before any native backend exists.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    # Direct2D + DirectWrite for the overlay's grayscale-antialiased label
    # text (`src/windows/label_text.rs`) and `examples/label_compare.rs`.
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    # Gates ID2D1RenderTarget::CreateSolidColorBrush (brush transform type).
    "Foundation_Numerics",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # QPC, process memory, power plan and RAM: used by the `telemetry`
    # feature (src/telemetry/), declared unconditionally (no runtime cost).
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    # QueryThreadCycleTime / QueryProcessCycleTime (telemetry CPU per span).
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    # ChooseColorW common dialog for the Settings color-picker swatches.
    "Win32_UI_Controls_Dialogs",
    # SetWinEventHook + EVENT_SYSTEM_FOREGROUND / EVENT_OBJECT_LOCATIONCHANGE
    # — feeds HWNDs to the Phase-4 pre-warm worker so the hotkey-time
    # cache is already hot when the user fires the chord.
    "Win32_UI_Accessibility",
] }
uiautomation = "0.24"
# Phase 5: per-process-group parallel window walks. Most of the time
# in `enumerate_windows_filtered` is spent waiting on COM IPC against
# remote app processes; rayon lets us overlap those waits across
# pid-groups without oversubscribing any one app's UI thread.
rayon = "1"
global-hotkey = "0.7"
# default-features off skips the X11 (`libxdo`) backend muda would pull in
# otherwise — pure dead weight on Windows.
tray-icon = { version = "0.22", default-features = false }
# Cross-platform file-system watcher backing the live `config.toml`
# reload. Only used on Windows in practice (the rest of the watcher
# code is `cfg(windows)`-gated) but `notify` itself is portable.
notify = "6"
# PNG image decoding for splash screen and tray icon.
png = "0.17"

[features]
# Exposes `jumpkey::windows::overlay::bench` for the criterion benchmarks.
# Not part of the public API; off by default.
bench = []
# In-app timing of the element picker: one JSON line per pick in
# %LOCALAPPDATA%\jumpkey\telemetry\ (see docs/TELEMETRY.md). Off by default
# and never enabled in released builds; `cargo script run-telemetry`
# installs a build with it.
telemetry = ["dep:serde_json"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "overlay_render"
harness = false
required-features = ["bench"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# cargo-wix configuration for the MSI installer. `cargo wix` builds
# an MSI from `wix/main.wxs` and writes it to `target/wix/`. The
# generated package supports silent install (`msiexec /i ... /qn`),
# registers a single Add/Remove Programs entry, and adds a Start Menu
# shortcut + PATH entry. See `docs/CODE_SIGNING.md` for the signing
# step that runs after `cargo wix` in release builds.
[package.metadata.wix]
name = "Jumpkey"
manufacturer = "Graham Doerksen"
# Skip the EULA dialog: Microsoft Store policy 10.2.9 only validates
# `msiexec /qn` (silent), and an EULA would only ever block users who
# *do* see the UI. The MIT license still ships as a sidecar file.
eula = false
# `cargo wix init` already generated wix/main.wxs; don't regenerate.
no-build = false
